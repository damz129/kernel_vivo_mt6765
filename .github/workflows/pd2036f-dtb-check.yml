name: PD2036F DTB Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - ci/pd2036f-dtb-audio-camera
    paths:
      - "arch/arm64/boot/dts/**"
      - "arch/arm64/configs/PD2036F_EX_KSU_defconfig"
      - ".github/workflows/pd2036f-dtb-check.yml"
  pull_request:
    paths:
      - "arch/arm64/boot/dts/**"
      - "arch/arm64/configs/PD2036F_EX_KSU_defconfig"
      - ".github/workflows/pd2036f-dtb-check.yml"

permissions:
  contents: read

jobs:
  build-pd2036f-dtb:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev libyaml-dev pkg-config \
            gcc-aarch64-linux-gnu

      - name: Verify target defconfig
        run: |
          test -f arch/arm64/configs/PD2036F_EX_KSU_defconfig
          grep -qx 'CONFIG_MTK_CAM_PD2036F_EX=y' \
            arch/arm64/configs/PD2036F_EX_KSU_defconfig
          grep -qx 'CONFIG_MTK_TINYSYS_SCP_SUPPORT=y' \
            arch/arm64/configs/PD2036F_EX_KSU_defconfig
          grep -qx 'CONFIG_KSU=y' \
            arch/arm64/configs/PD2036F_EX_KSU_defconfig

      - name: Generate kernel configuration
        run: |
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            PD2036F_EX_KSU_defconfig
          grep -qx 'CONFIG_MTK_CAM_PD2036F_EX=y' .config
          grep -qx 'CONFIG_MTK_TINYSYS_SCP_SUPPORT=y' .config
          grep -qx 'CONFIG_KSU=y' .config

      - name: Build Vivo Y20 2021 DTB
        run: |
          make -j2 ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            mediatek/k65v1_64_bsp_PD2036F_EX.dtb

      - name: Validate generated DTB
        run: |
          DTB=arch/arm64/boot/dts/mediatek/k65v1_64_bsp_PD2036F_EX.dtb
          test -s "$DTB"
          scripts/dtc/dtc -I dtb -O dts "$DTB" \
            -o /tmp/pd2036f-check.dts
          test -s /tmp/pd2036f-check.dts

      - name: Upload DTB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pd2036f-kernel-dtb
          path: arch/arm64/boot/dts/mediatek/k65v1_64_bsp_PD2036F_EX.dtb
          if-no-files-found: error
