name: PD2036F Device Tree Lab

on:
  workflow_dispatch:
    inputs:
      stock_dtb_path:
        description: "Optional path to a stock .dtb file inside the checked-out repository"
        required: false
        type: string
      stock_dtbo_path:
        description: "Optional path to an Android dtbo.img or raw DTBO .dtb inside the checked-out repository"
        required: false
        type: string
  push:
    branches:
      - ci/pd2036f-dtb-audio-camera
    paths:
      - "arch/arm64/boot/dts/**"
      - "arch/arm64/configs/PD2036F_EX_KSU_defconfig"
      - ".github/workflows/pd2036f-device-tree-lab.yml"

permissions:
  contents: read

jobs:
  device-tree-lab:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libyaml-dev pkg-config gcc-aarch64-linux-gnu python3

      # Match the KernelSU Next setup used by .github/workflows/main.yml
      - name: Setup KernelSU Next
        run: |
          set -euo pipefail
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          test -d drivers/kernelsu
          echo "KernelSU Next legacy integration is present in drivers/kernelsu"

      - name: Verify and generate PD2036F KSU configuration
        run: |
          set -euo pipefail
          # Normalize legacy CRLF Kconfig files before parsing.
          find . -name 'Kconfig*' -type f -exec sed -i 's/\r$//' {} +
          grep -qx 'CONFIG_MTK_CAM_PD2036F_EX=y' arch/arm64/configs/PD2036F_EX_KSU_defconfig
          grep -qx 'CONFIG_MTK_TINYSYS_SCP_SUPPORT=y' arch/arm64/configs/PD2036F_EX_KSU_defconfig
          grep -qx 'CONFIG_KSU=y' arch/arm64/configs/PD2036F_EX_KSU_defconfig
          grep -qx 'CONFIG_SND_SOC_AW87XXX=y' arch/arm64/configs/PD2036F_EX_KSU_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out PD2036F_EX_KSU_defconfig
          test -s out/.config
          echo '--- Generated config: relevant symbols ---'
          grep -E '^(CONFIG_(I2C|SND_SOC|SND_SOC_AW87XXX|SND_SOC_MEDIATEK|MTK_CAM_PD2036F_EX|MTK_TINYSYS_SCP_SUPPORT|KSU)=|# CONFIG_(I2C|SND_SOC_AW87XXX) is not set)' out/.config || true
          echo '--- End generated config ---'
          grep -qx 'CONFIG_MTK_CAM_PD2036F_EX=y' out/.config
          grep -qx 'CONFIG_MTK_TINYSYS_SCP_SUPPORT=y' out/.config
          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_SND_SOC_AW87XXX=y' out/.config
          echo 'Verified: camera, SCP, KSU and AW87XXX are enabled in out/.config'

      - name: Build target kernel DTB
        run: |
          set -euo pipefail
          make -j2 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out mediatek/k65v1_64_bsp_PD2036F_EX.dtb
          test -s out/arch/arm64/boot/dts/mediatek/k65v1_64_bsp_PD2036F_EX.dtb

          echo "--- DTC executable diagnostics ---"
          echo "PATH dtc:"
          command -v dtc || true
          echo "Executable named dtc in source tree:"
          find scripts -type f -name dtc -executable -print 2>/dev/null || true
          echo "DTC files in output tree:"
          find out -type f -name dtc -print 2>/dev/null || true
          echo "--- End DTC diagnostics ---"

      - name: Decompile and round-trip validate kernel DTB
        run: |
          set -euo pipefail
          mkdir -p out/device-tree/kernel
          DTB=out/arch/arm64/boot/dts/mediatek/k65v1_64_bsp_PD2036F_EX.dtb
          DTC=out/scripts/dtc/dtc
          test -x "$DTC"
          "$DTC" -I dtb -O dts -o out/device-tree/kernel/pd2036f-kernel.dts "$DTB"
          "$DTC" -I dts -O dtb -o out/device-tree/kernel/pd2036f-roundtrip.dtb out/device-tree/kernel/pd2036f-kernel.dts
          "$DTC" -I dtb -O dts -o out/device-tree/kernel/pd2036f-roundtrip.dts out/device-tree/kernel/pd2036f-roundtrip.dtb
          test -s out/device-tree/kernel/pd2036f-kernel.dts
          test -s out/device-tree/kernel/pd2036f-roundtrip.dtb

      - name: Decode optional stock DTB and Android DTBO image
        env:
          STOCK_DTB_PATH: ${{ inputs.stock_dtb_path }}
          STOCK_DTBO_PATH: ${{ inputs.stock_dtbo_path }}
        run: |
          python3 - <<'PY'
          import os, struct, subprocess, pathlib, sys
          out = pathlib.Path("out/device-tree/stock")
          out.mkdir(parents=True, exist_ok=True)

          def decompile(data, name):
              dtb = out / f"{name}.dtb"
              dts = out / f"{name}.dts"
              dtb.write_bytes(data)
              dtc = pathlib.Path("out/scripts/dtc/dtc")
              if not dtc.is_file() or not os.access(dtc, os.X_OK):
                  raise SystemExit(f"Kernel-built DTC is missing or not executable: {dtc}")
              subprocess.run([str(dtc), "-I", "dtb", "-O", "dts", "-o", str(dts), str(dtb)], check=True)
              print(f"Decoded {name}: {len(data)} bytes -> {dts}")

          dtb_path = os.environ.get("STOCK_DTB_PATH", "").strip()
          if dtb_path:
              p = pathlib.Path(dtb_path)
              if not p.is_file():
                  raise SystemExit(f"Stock DTB path does not exist: {p}")
              decompile(p.read_bytes(), "stock-dtb")

          dtbo_path = os.environ.get("STOCK_DTBO_PATH", "").strip()
          if dtbo_path:
              p = pathlib.Path(dtbo_path)
              if not p.is_file():
                  raise SystemExit(f"Stock DTBO path does not exist: {p}")
              blob = p.read_bytes()
              if len(blob) < 4:
                  raise SystemExit("DTBO input is too small")
              magic = struct.unpack_from(">I", blob, 0)[0]
              if magic == 0xD7B7AB1E:
                  if len(blob) < 32:
                      raise SystemExit("Android DT table header is truncated")
                  _, total, header_size, entry_size, count, entries_off, page_size, version = struct.unpack_from(">8I", blob, 0)
                  if total > len(blob) or header_size < 32 or entry_size < 32 or entries_off + count * entry_size > total:
                      raise SystemExit("Invalid Android DT table header/entry bounds")
                  print(f"Android DT table: entries={count}, page_size={page_size}, version={version}")
                  for i in range(count):
                      off = entries_off + i * entry_size
                      size, offset = struct.unpack_from(">2I", blob, off)
                      if size == 0 or offset + size > total:
                          raise SystemExit(f"Invalid DTBO entry {i}: offset={offset}, size={size}")
                      entry = blob[offset:offset+size]
                      if struct.unpack_from(">I", entry, 0)[0] != 0xD00DFEED:
                          raise SystemExit(f"Entry {i} does not contain a valid FDT blob")
                      decompile(entry, f"stock-dtbo-{i:02d}")
              elif struct.unpack_from(">I", blob, 0)[0] == 0xD00DFEED:
                  decompile(blob, "stock-dtbo")
              else:
                  raise SystemExit("Input is neither an Android DT table image nor a raw DTB/DTBO FDT blob")
          PY

      - name: Create device-tree report
        run: |
          {
            echo "# PD2036F Device Tree Lab"
            echo
            echo "- Defconfig: PD2036F_EX_KSU_defconfig"
            echo "- Kernel DTB: arch/arm64/boot/dts/mediatek/k65v1_64_bsp_PD2036F_EX.dtb"
            echo "- DTC: out/scripts/dtc/dtc"
            echo "- DTC version: $(out/scripts/dtc/dtc --version)"
            echo
            echo "## Generated files"
            find out/device-tree -type f -printf '%p (%s bytes)\n' | sort
            echo
            echo "## Key kernel DTS nodes"
            grep -nE 'kd_camera_hw|camera_main|camera_sub|speaker_amp|audio|sound|pinctrl' out/device-tree/kernel/pd2036f-kernel.dts | head -n 160 || true
          } > out/device-tree/REPORT.md
          cat out/device-tree/REPORT.md

      - name: Upload Device Tree Lab artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pd2036f-device-tree-lab
          path: |
            out/device-tree/
            out/arch/arm64/boot/dts/mediatek/k65v1_64_bsp_PD2036F_EX.dtb
          if-no-files-found: error
          retention-days: 14

      - name: Upload kernel-built DTC executable
        uses: actions/upload-artifact@v4
        with:
          name: pd2036f-dtc-tool
          path: out/scripts/dtc/dtc
          if-no-files-found: error
          retention-days: 14
